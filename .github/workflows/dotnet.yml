name: Build and Test ASP.NET MVC

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'

    - name: Restore dependencies
      run: dotnet restore AutomationTesting/AutomationTesting.sln

    - name: Build project
      run: dotnet build "AutomationTesting/AutomationTesting.sln" --no-restore --configuration Release

    - name: Run tests
      run: dotnet test AutomationTesting/AutomationTesting.sln --no-build --configuration Release

